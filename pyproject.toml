[project]
name = "fuse-slack-emoji"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.13"
dependencies = [
    "cbor2==5.8.0",
    "fuse-python==1.0.9",
    "numpy==2.4.0",
    "pillow==12.0.0",
    "pydantic==2.12.5",
    "python-dotenv==1.2.1",
    "slack-sdk==3.39.0",
    "typing-extensions>=4.15.0",
]

[build-system]
requires = ["uv_build>=0.11.3,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "slack_emoji_fs"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "hypothesis>=6.165.10",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]
